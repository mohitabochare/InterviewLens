<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>InterviewLens — Session Reports</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #15130F;
    --surface: #1E1B16;
    --surface-hover: #262219;
    --border: #34302A;
    --text-primary: #F2EDE4;
    --text-secondary: #A79E8E;
    --accent: #E8A33D;
    --low: #C1503A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Inter', system-ui, sans-serif;
    padding: 48px 24px 80px;
  }
  header {
    max-width: 880px;
    margin: 0 auto 40px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 2rem;
    margin: 0 0 4px;
    letter-spacing: -0.02em;
  }
  header p {
    color: var(--text-secondary);
    margin: 0;
  }
  main {
    max-width: 880px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 24px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .card:hover, .card:focus-visible {
    background: var(--surface-hover);
    border-color: var(--accent);
  }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 12px;
  }
  .session-label {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 1.05rem;
  }
  .session-date {
    color: var(--text-secondary);
    font-size: 0.85rem;
  }
  .scores {
    display: flex;
    gap: 28px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .score {
    position: relative;
    padding: 4px 10px;
  }
  .score::before, .score::after {
    content: "";
    position: absolute;
    width: 8px;
    height: 8px;
    border: 1.5px solid var(--accent);
    opacity: 0.7;
  }
  .score::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .score::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }
  .score-value {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 1.3rem;
  }
  .score-value.low { color: var(--low); }
  .score-label {
    display: block;
    font-size: 0.7rem;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 2px;
  }
  .detail {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    display: none;
  }
  .detail.open { display: block; }
  .detail h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.9rem;
    margin: 0 0 6px;
    color: var(--accent);
  }
  .detail p, .detail li {
    font-size: 0.92rem;
    line-height: 1.5;
    color: var(--text-primary);
  }
  .detail .transcript {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    color: var(--text-secondary);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    margin: 4px 0 16px;
  }
  .detail ul { margin: 4px 0 16px; padding-left: 18px; }
  .empty {
    color: var(--text-secondary);
    padding: 60px 0;
    text-align: center;
  }
  .empty strong { color: var(--text-primary); display: block; margin-bottom: 6px; font-family: 'Space Grotesk', sans-serif; }
</style>
</head>
<body>

<header>
  <h1>InterviewLens</h1>
  <p>Practice session reports — vision, voice, and answer analysis</p>
</header>

<main id="sessions">
  <p class="empty">Loading sessions…</p>
</main>

<script>
async function loadSessions() {
  const container = document.getElementById('sessions');
  try {
    const res = await fetch('/session/');
    const sessions = await res.json();

    if (!sessions.length) {
      container.innerHTML = `<div class="empty"><strong>No interviews recorded yet</strong>Run a practice session with live_session.py to see your first report here.</div>`;
      return;
    }

    container.innerHTML = '';
    sessions.forEach(s => container.appendChild(renderCard(s)));
  } catch (e) {
    container.innerHTML = `<div class="empty"><strong>Could not load sessions</strong>Check that the backend server is running.</div>`;
  }
}

function scoreClass(value) {
  return (value !== null && value < 60) ? 'score-value low' : 'score-value';
}

function fmt(value, suffix = '') {
  return (value === null || value === undefined) ? '—' : `${value}${suffix}`;
}

function renderCard(s) {
  const card = document.createElement('div');
  card.className = 'card';
  card.tabIndex = 0;

  const date = new Date(s.start_time).toLocaleString();

  card.innerHTML = `
    <div class="card-top">
      <span class="session-label">Session #${s.session_id}</span>
      <span class="session-date">${date}</span>
    </div>
    <div class="scores">
      <div class="score"><span class="${scoreClass(s.confidence_score)}">${fmt(s.confidence_score, '%')}</span><span class="score-label">Confidence</span></div>
      <div class="score"><span class="${scoreClass(s.eye_contact_score)}">${fmt(s.eye_contact_score, '%')}</span><span class="score-label">Eye contact</span></div>
      <div class="score"><span class="score-value">${fmt(s.speaking_rate_wpm)}</span><span class="score-label">Words/min</span></div>
      <div class="score"><span class="score-value">${fmt(s.filler_word_count)}</span><span class="score-label">Fillers</span></div>
    </div>
    <div class="detail">
      <h3>Transcript</h3>
      <div class="transcript">${s.transcript || 'No transcript recorded.'}</div>
      <h3>Strengths</h3>
      <ul>${(s.answer_strengths || []).map(x => `<li>${x}</li>`).join('') || '<li>None recorded.</li>'}</ul>
      <h3>Improve</h3>
      <ul>${(s.answer_improvements || []).map(x => `<li>${x}</li>`).join('') || '<li>None recorded.</li>'}</ul>
    </div>
  `;

  const detail = card.querySelector('.detail');
  const toggle = () => detail.classList.toggle('open');
  card.addEventListener('click', toggle);
  card.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
  });

  return card;
}

loadSessions();
</script>

</body>
</html>
